apiVersion: v1
kind: Service
metadata:
  name: lightstreamer
spec:
  type: NodePort
  selector:
    app: lightstreamer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: exporter
      port: 9100
      targetPort: 9100
      nodePort: 31010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightstreamer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lightstreamer
  template:
    metadata:
      labels:
        app: lightstreamer
    spec:
      containers:
        - name: lightstreamer
          image: lightstreamer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 9100
          volumeMounts:
            - name: adapter-volume
              mountPath: /lightstreamer/adapters/metrics_exporter
      volumes:
        - name: adapter-volume
          hostPath:
            path: /mnt/repo/adapters/metrics_exporter
            type: Directory